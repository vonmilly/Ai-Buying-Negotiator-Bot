version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333" # Qdrant HTTP API
      - "6334:6334" # Qdrant gRPC API
    volumes:
      - qdrant_data:/qdrant/storage # Persist Qdrant data
    restart: unless-stopped

  ai_negotiator_api:
    build:
      context: . # Build context is the root directory (where Dockerfile is)
      dockerfile: Dockerfile
    container_name: ai_negotiator_api
    ports:
      - "8000:8000" # FastAPI application port
    environment:
      # Ensure these match your Qdrant service name and port
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      - qdrant # Ensure Qdrant starts before the API
    restart: unless-stopped

volumes:
  qdrant_data: # Define the named volume for Qdrant data persistence
